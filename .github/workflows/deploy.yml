name: Deploy to Google VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_ENV: ${{ secrets.ENV }}
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          envs: TARGET_ENV
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            export PATH=$PATH:/home/${{ secrets.GCP_USERNAME }}/.bun/bin

            cd thalles-api

            # Salva o commit atual antes de atualizar
            BEFORE=$(git rev-parse HEAD)

            # Atualiza o código
            git fetch --all
            git reset --hard origin/main

            echo "$TARGET_ENV" > .env

            # Instala dependências novas (se houver)
            bun install

            # Roda migrations apenas das APIs que tiveram arquivos novos
            if git diff --name-only "$BEFORE" HEAD -- src/trophies/infrastructure/migrations/ | grep -q .; then
              echo "Rodando migrations Trophies..."
              bun run trophies-migration:run
            else
              echo "Sem migrations novas para Trophies, pulando."
            fi

            if git diff --name-only "$BEFORE" HEAD -- src/gincana/infrastructure/migrations/ | grep -q .; then
              echo "Rodando migrations Gincana..."
              bun run gincana-migration:run
            else
              echo "Sem migrations novas para Gincana, pulando."
            fi

            if git diff --name-only "$BEFORE" HEAD -- src/financeiro/infrastructure/migrations/ | grep -q .; then
              echo "Rodando migrations Financeiro..."
              bun run financeiro-migration:run
            else
              echo "Sem migrations novas para Financeiro, pulando."
            fi

            # Reinicia a aplicação no PM2
            pm2 restart thalles-api --update-env

            # Salva a lista de processos (para se a VM reiniciar)
            pm2 save

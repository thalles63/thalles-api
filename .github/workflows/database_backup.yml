name: Weekly Neon Backup to Google Drive

on:
  schedule:
    - cron: '0 2 * * 0'  # todo domingo às 2h UTC
  workflow_dispatch:     # permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instala rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Verifica versão do Docker
        run: docker --version

      - name: Cria config do rclone (multiline seguro)
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF

      - name: Faz dump do banco Neon usando container PostgreSQL 17
        env:
          DATABASE_URL: ${{ secrets.NEON_URL }}
        run: |
          docker run --rm -e PGPASSWORD=$(echo $DATABASE_URL | sed -E 's/.*:(.*)@.*/\1/' | cut -d'@' -f1) postgres:17 \
          sh -c "pg_dump \"$DATABASE_URL\"" > backup.sql

      - name: Upload para Google Drive
        run: |
          FOLDER="neon_backups"
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M)
          rclone mkdir gdrive:$FOLDER
          rclone copy backup.sql gdrive:$FOLDER/backup_$TIMESTAMP.sql
